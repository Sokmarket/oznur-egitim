<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>AI Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui;padding:16px;background:#0a0714;color:#f5f0e3;line-height:1.6;max-width:600px;margin:auto}
h1{color:#f6d17b;font-size:18px;margin:0 0 14px}
label{display:block;font-size:12px;color:#a5b0c4;margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #a78bfa33;border-radius:10px;background:#131020;color:#f5f0e3;font-size:14px;box-sizing:border-box;font-family:inherit}
button{width:100%;padding:12px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#bb8736);color:#fff;border:0;font-size:15px;font-weight:600;margin-top:12px;cursor:pointer}
.out{margin-top:14px;padding:12px;background:#050b12;border:1px solid #a78bfa33;border-radius:8px;font-family:monospace;font-size:12px;color:#6ee7a5;white-space:pre-wrap;word-break:break-word;min-height:80px;max-height:400px;overflow-y:auto}
.hint{font-size:11px;color:#a5b0c4;margin-top:4px}
.bad{color:#f87171}
.ok{color:#6ee7a5}
</style></head>
<body>
<h1>🤖 AI Bağlantı Testi</h1>

<label>Sağlayıcı</label>
<select id="prov" onchange="updateHint()">
  <option value="groq">⚡ Groq (ücretsiz)</option>
  <option value="gemini">🔵 Google Gemini (ücretsiz)</option>
  <option value="openai">🟢 OpenAI</option>
</select>

<label>API Anahtarı</label>
<input type="text" id="key" placeholder="gsk_... veya AIza..." autocomplete="off">

<label>Model</label>
<input type="text" id="model" placeholder="llama-3.1-8b-instant" value="llama-3.1-8b-instant">

<p class="hint" id="provHint">
💡 Groq anahtarı: <a href="https://console.groq.com/keys" target="_blank" style="color:#f6d17b">console.groq.com/keys</a>
</p>

<button onclick="testAI()">🧪 Test Et</button>

<div class="out" id="out">Sonuç burada görünecek…</div>

<script>
function updateHint(){
  const p = document.getElementById('prov').value;
  const h = document.getElementById('provHint');
  const m = document.getElementById('model');
  if(p === 'groq'){ 
    h.innerHTML = '💡 Groq: <a href="https://console.groq.com/keys" target="_blank" style="color:#f6d17b">console.groq.com/keys</a>';
    m.value = 'llama-3.1-8b-instant';
  }
  if(p === 'gemini'){ 
    h.innerHTML = '💡 Gemini: <a href="https://aistudio.google.com/apikey" target="_blank" style="color:#f6d17b">aistudio.google.com/apikey</a>';
    m.value = 'gemini-1.5-flash';
  }
  if(p === 'openai'){ 
    h.innerHTML = '💡 OpenAI: <a href="https://platform.openai.com/api-keys" target="_blank" style="color:#f6d17b">platform.openai.com/api-keys</a>';
    m.value = 'gpt-4o-mini';
  }
}

async function testAI(){
  const out = document.getElementById('out');
  const prov = document.getElementById('prov').value;
  const key = document.getElementById('key').value.trim();
  const model = document.getElementById('model').value.trim();
  
  out.textContent = '⏳ Test ediliyor...\n';
  
  if(!key){ 
    out.innerHTML = '<span class="bad">❌ Anahtar boş</span>'; 
    return; 
  }
  
  out.textContent += 'Anahtar uzunluğu: ' + key.length + ' karakter\n';
  out.textContent += 'Anahtar başlangıcı: ' + key.slice(0, 8) + '...\n';
  out.textContent += 'Model: ' + model + '\n\n';
  
  try {
    if(prov === 'groq'){
      const url = 'https://api.groq.com/openai/v1/chat/completions';
      out.textContent += 'POST → ' + url + '\n';
      const r = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + key
        },
        body: JSON.stringify({
          model: model,
          messages: [{role:'user', content:'Tek kelimeyle cevap ver: çalışıyor'}],
          max_tokens: 20
        })
      });
      out.textContent += 'HTTP ' + r.status + ' ' + r.statusText + '\n\n';
      const data = await r.json();
      out.textContent += 'Yanıt:\n' + JSON.stringify(data, null, 2);
      if(r.ok){
        out.innerHTML += '\n\n<span class="ok">✅ BAŞARILI! Cevap: ' + (data.choices?.[0]?.message?.content || '') + '</span>';
      } else {
        out.innerHTML += '\n\n<span class="bad">❌ HATA — anahtar geçersiz veya limit doldu</span>';
      }
    }
    
    if(prov === 'gemini'){
      const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + key;
      const r = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          contents: [{parts:[{text:'Tek kelimeyle cevap ver: çalışıyor'}]}]
        })
      });
      out.textContent += 'HTTP ' + r.status + '\n\n';
      const data = await r.json();
      out.textContent += JSON.stringify(data, null, 2);
      if(r.ok && data.candidates){
        out.innerHTML += '\n\n<span class="ok">✅ BAŞARILI! Cevap: ' + (data.candidates[0]?.content?.parts?.[0]?.text || '') + '</span>';
      } else {
        out.innerHTML += '\n\n<span class="bad">❌ HATA</span>';
      }
    }
    
    if(prov === 'openai'){
      const r = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + key
        },
        body: JSON.stringify({
          model: model,
          messages: [{role:'user', content:'Tek kelimeyle cevap ver: çalışıyor'}],
          max_tokens: 20
        })
      });
      out.textContent += 'HTTP ' + r.status + '\n\n';
      const data = await r.json();
      out.textContent += JSON.stringify(data, null, 2);
      if(r.ok){
        out.innerHTML += '\n\n<span class="ok">✅ BAŞARILI!</span>';
      } else {
        out.innerHTML += '\n\n<span class="bad">❌ HATA</span>';
      }
    }
  } catch(e) {
    out.innerHTML += '\n\n<span class="bad">❌ Ağ hatası: ' + e.message + '</span>';
  }
}
</script>
</body>
</html>
